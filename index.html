<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جدول الدراسة اليومي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --green: #52b788; --green-light: #74c69d;
    --gold: #f9c74f; --gold-light: #f9c74f;
    --bg: #0d1117; --white: #161b22;
    --text: #e6edf3; --muted: #8b949e;
    --prayer-bg: #0a1628;
    --shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Cairo',sans-serif;
    background:var(--bg);
    min-height:100vh;
    padding:30px 20px 60px;
    color:var(--text);
  }
  .page-title { text-align:center; font-size:2.4rem; font-weight:900; color:var(--text); margin-bottom:6px; }
  .page-title span { color:var(--green-light); }
  .page-subtitle { text-align:center; color:var(--muted); font-size:0.9rem; margin-bottom:16px; }

  /* yesterday */
  #yesterdayBanner { display:none; max-width:720px; margin:0 auto 16px; background:var(--prayer-bg); border-radius:14px; padding:12px 20px; justify-content:center; box-shadow:var(--shadow); }
  #yesterdayText { color:var(--gold-light); font-size:0.95rem; font-weight:700; }

  /* chart */
  .chart-wrap { max-width:720px; margin:0 auto 14px; text-align:center; }
